; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = stm32cube

lib_deps = 
    FreeRTOS
lib_ignore =
    eigen

build_flags =
  -mfpu=fpv4-sp-d16
  -mfloat-abi=softfp
  -DF4
  -D DEV 
  -I lib/FreeRTOS/include
  -I lib/FreeRTOS/CMSIS_RTOS_V2
  -I lib/FreeRTOS/portable/GCC/ARM_CM4F
  -Ilib/eigen
  -Iinclude

lib_archive = no
lib_ldf_mode = deep+

check_tool = clangtidy, cppcheck

check_src_filters =
    +<src/**>
    -<lib/**>
    -<.pio/**>
    -<lib/FreeRTOS/include/*>
    -<lib/FreeRTOS/CMSIS_RTOS_V2/*>
    -<lib/FreeRTOS/portable/GCC/ARM_CM4F/*>
    -<lib/eigen/*>

check_flags =
    clangtidy: --config-file=../.clang-tidy
    cppcheck: --enable=all
    cppcheck: --addon=misra
    cppcheck: --inline-suppr
    cppcheck: --suppressions-list=cppcheck.suppress
    cppcheck: --showtime=file-total 
    cppcheck: --inconclusive
    cppcheck: --force
    cppcheck: src lib/braiteoiri/include lib/comheadan/include

[env:stm32f072c8t6]
platform = ststm32
board = stm32f072c8t6
framework = stm32cube

lib_deps = 
    FreeRTOS
lib_ignore =
    eigen

build_flags =
  -DSTM32F072xB
  -D STM32F0
  -D DEV 
  -D STM
  -D F0
  -I lib/FreeRTOS/include
  -I lib/FreeRTOS/CMSIS_RTOS_V2_f0
  -I lib/FreeRTOS/portable/GCC/ARM_CM0 
  -Ilib/eigen
  -Iinclude
  -Wl,-Map=.pio/build/memory.map

build_src_filter =
    +<main.cpp>
    -<platform/*>
    +<platform/stm_f0.cpp>
    -<tools/*>

lib_archive = no
lib_ldf_mode = deep+

check_tool = clangtidy, cppcheck

check_src_filters =
    +<src/**>
    -<lib/**>
    -<.pio/**>
    -<lib/FreeRTOS/include/*>
    -<lib/FreeRTOS/CMSIS_RTOS_V2/*>
    -<lib/FreeRTOS/portable/GCC/ARM_CM4F/*>
    -<lib/eigen/*>

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

