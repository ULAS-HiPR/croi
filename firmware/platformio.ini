; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:stm32f072c8t6]
platform = ststm32
board = stm32f072c8t6
framework = stm32cube

lib_deps = 
    FreeRTOS
lib_ignore =
    eigen

build_flags =
  -DSTM32F072xB
  -D STM32F0
  -D DEV 
  -D STM
  -D F0
  -D CAN_COMPATIBLE
  -I lib/FreeRTOS/include
  -I lib/FreeRTOS/CMSIS_RTOS_V2_f0
  -I lib/FreeRTOS/portable/GCC/ARM_CM0 
  -Ilib/eigen
  -Iinclude
  -Wl,--print-memory-usage
  -Wl,-Map,output.map

build_src_filter =
    +<*>
    -<lib/FreeRTOS/CMSIS_RTOS_V2/*>
    -<lib/FreeRTOS/portable/GCC/ARM_CM4F/*>

lib_archive = no
lib_ldf_mode = deep+

check_tool = clangtidy, cppcheck

check_src_filters =
    +<src/**>
    -<lib/**>
    -<.pio/**>
    -<lib/FreeRTOS/include/*>
    -<lib/FreeRTOS/CMSIS_RTOS_V2/*>
    -<lib/FreeRTOS/portable/GCC/ARM_CM4F/*>
    -<lib/eigen/*>

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[env:stm32f072c8t6_flash_wipe]
extends = env:stm32f072c8t6
build_flags =
  ${env:stm32f072c8t6.build_flags}
  -DCROI_WIPE_FLASH_ON_BOOT=1


[env:sil]
platform = native
test_build_src = yes

lib_ignore =
    eigen
    braiteoiri
    comheadan

build_src_filter =
    +<tools/kalman_filter.cpp>

lib_archive = no

build_flags = 
    -std=gnu++17
    -DUNIT_TEST
    -Isrc
    -Ilib/eigen
    -Ilib/comheadan/include/
    -Iinclude
